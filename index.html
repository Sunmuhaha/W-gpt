<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>แชทกับ AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- เปลี่ยนเป็นฟอนต์ที่รองรับทั้งภาษาไทยและอังกฤษผ่าน Google Fonts API ได้จริง -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --wine: #120307;
  --crimson: #e11d48;
  --ruby: #9f1239;
  --coral: #ff6b81;
  --rose: #ffd6dc;
  --glass: rgba(255, 255, 255, 0.08);
  --glass-strong: rgba(255, 255, 255, 0.15);
  --glass-hover: rgba(255, 255, 255, 0.22);
  --line: rgba(255, 255, 255, 0.18);
  --text: #fff5f6;
  --muted: rgba(255, 230, 234, 0.65);
  --sidebar-w: 260px;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -ms-overflow-style: none !important;
  scrollbar-width: none !important;
}
*::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  font-family: 'Google Sans',  system-ui, -apple-system, sans-serif;
  color: var(--text);
  background: radial-gradient(120% 90% at 20% 0%, #4a0a18 0%, var(--wine) 60%) fixed;
}

.orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: .65; pointer-events: none; z-index: 0; }
.o1 { width: 450px; height: 450px; background: var(--crimson); top: -120px; left: -100px; }
.o2 { width: 400px; height: 400px; background: var(--ruby); bottom: -110px; right: -80px; }
.o3 { width: 250px; height: 250px; background: var(--coral); top: 45%; left: 50%; opacity: .25; }

.layout {
  position: relative;
  z-index: 1;
  height: 100%;
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  gap: 14px;
  padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
}

.glass {
  background: var(--glass);
  border: 1px solid var(--line);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
}

.sidebar-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  width: 100vw; height: 100vh;
  background: rgba(0, 0, 0, 0.65);
  z-index: 90;
}
.sidebar-overlay.active { display: block; }

.sidebar {
  width: var(--sidebar-w);
  display: flex;
  flex-direction: column;
  gap: 12px;
  border-radius: 24px;
  padding: 16px;
  flex: none;
  transition: transform 0.25s ease;
  z-index: 100;
}

.sidebar-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sidebar-action-group { display: flex; align-items: center; gap: 6px; }
.sidebar-title { font-size: 15px; font-weight: 600; color: var(--text); }
.history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }

.history-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,0.03);
  border: 1px solid transparent; color: var(--muted); cursor: pointer; font-size: 13px;
  transition: all 0.2s;
}
.history-item:hover { background: var(--glass-strong); color: var(--text); }
.history-item.active { background: var(--glass-hover); border-color: var(--line); color: var(--text); font-weight: 500; }
.history-item .title-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.history-item .del-btn {
  border: 0; background: none; color: var(--muted); cursor: pointer; padding: 4px; display: none;
  border-radius: 6px; line-height: 0; flex: none;
}
.history-item:hover .del-btn { display: block; }
.history-item .del-btn:hover { color: #ff4d4d; background: rgba(255,255,255,0.1); }

#closeSidebarBtn { display: none; }

.app { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; height: 100%; }

header { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-radius: 22px; }
.avatar {
  width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; flex: none;
  background: linear-gradient(135deg, var(--coral), var(--crimson));
  box-shadow: 0 6px 18px rgba(225,29,72,0.45), inset 0 1px 0 rgba(255,255,255,0.4);
}
.avatar svg { width: 22px; height: 22px; fill: #fff; }
.title { font-weight: 600; font-size: 16px; letter-spacing: -0.2px; }
.status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 1px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #ffb4bf; transition: .3s; }
.dot.on { background: #7dffb0; box-shadow: 0 0 10px #7dffb0; }
.dot.err { background: #ff4d4d; }
.sp { flex: 1; }

.icon-btn {
  width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass);
  color: var(--text); cursor: pointer; display: grid; place-items: center; transition: all .2s;
  user-select: none;
}
.icon-btn:hover { background: var(--glass-strong); }
.icon-btn:active { transform: scale(.95); }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

#toggleSidebar { display: none; }

#chat {
  flex: 1; min-height: 0; border-radius: 26px;
  padding: 20px 16px;
  overflow-y: auto; overflow-x: hidden;
  display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth;
}

.empty { margin: auto; text-align: center; max-width: 360px; color: var(--muted); line-height: 1.6; }
.empty h2 { color: var(--text); font-weight: 600; font-size: 22px; margin-bottom: 8px; }

.msg { display: flex; flex-direction: column; max-width: 82%; gap: 4px; }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.bot { align-self: flex-start; align-items: flex-start; }

.msg-meta { font-size: 11px; color: var(--muted); padding: 0 4px; }

.bubble {
  position: relative; padding: 12px 16px; border-radius: 20px; line-height: 1.6;
  font-size: 14.5px; word-break: break-word; white-space: pre-wrap;
}
.bot .bubble {
  background: var(--glass-strong); border: 1px solid var(--line); border-bottom-left-radius: 6px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
  padding-right: 48px;
}
.user .bubble {
  background: linear-gradient(135deg, rgba(255,107,129,0.9), rgba(225,29,72,0.95));
  border: 1px solid rgba(255,255,255,0.3); border-bottom-right-radius: 6px;
  box-shadow: 0 8px 24px rgba(225,29,72,0.35), inset 0 1px 0 rgba(255,255,255,0.35);
}

.copy-btn {
  position: absolute; top: 8px; right: 8px; opacity: 0.8; border: 1px solid var(--line);
  background: rgba(0, 0, 0, 0.4); color: var(--text); padding: 6px; border-radius: 8px;
  cursor: pointer; transition: all .2s; z-index: 5;
  display: flex; align-items: center; justify-content: center;
}
.copy-btn:hover, .copy-btn:active { opacity: 1; background: rgba(0, 0, 0, 0.7); }
.copy-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.composer {
  display: flex; align-items: flex-end; gap: 10px; padding: 10px 12px; border-radius: 26px;
  border: 1px solid var(--line);
}
.composer:focus-within {
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,107,129,0.6);
  box-shadow: 0 0 0 4px rgba(225,29,72,0.22);
}

textarea {
  flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: var(--text);
  font: inherit; font-size: 15px; line-height: 1.5; padding: 8px 10px; max-height: 140px;
}
textarea::placeholder { color: var(--muted); }

.send {
  width: 44px; height: 44px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.3); cursor: pointer; flex: none;
  display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, var(--coral), var(--crimson));
  box-shadow: 0 8px 20px rgba(225,29,72,0.4);
}
.send:disabled { opacity: .35; cursor: default; }
.send svg { width: 20px; height: 20px; fill: #fff; }

.setup { padding: 16px; border-radius: 20px; display: none; gap: 12px; flex-direction: column; font-size: 13px; color: var(--muted); }
.setup.show { display: flex; }
.setup-row { display: flex; gap: 8px; }
.setup input {
  flex: 1; min-width: 0; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: rgba(0,0,0,0.25); color: var(--text); font: inherit; font-size: 13px; outline: 0;
}
.setup button {
  padding: 0 16px; border-radius: 12px; border: 0; cursor: pointer; font: inherit; color: #fff;
  background: linear-gradient(135deg, var(--coral), var(--crimson)); font-weight: 500; flex: none;
}

@media (max-width: 768px) {
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 280px; height: 100%;
    background: rgba(24, 4, 10, 0.8) !important;
    -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
    border-radius: 0; border-right: 1px solid var(--line);
    transform: translateX(-100%); z-index: 100;
  }
  .sidebar.open { transform: translateX(0); }
  .history-item .del-btn { display: block; opacity: 0.7; }
  #toggleSidebar, #closeSidebarBtn { display: grid; }
}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<div class="layout">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar glass" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">ประวัติการสนทนา</span>
      <div class="sidebar-action-group">
        <button class="icon-btn" id="newChatSidebarBtn" title="สร้างแชทใหม่">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="icon-btn" id="closeSidebarBtn" title="ปิดเมนู">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <div class="history-list" id="historyList"></div>
  </aside>

  <main class="app">
    <header class="glass">
      <button class="icon-btn" id="toggleSidebar" aria-label="เมนูประวัติ">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="avatar"><svg viewBox="0 0 24 24"><path d="M12 2l1.8 5.4L19 9l-5.2 1.6L12 16l-1.8-5.4L5 9l5.2-1.6L12 2zm7 11l.9 2.6 2.6.9-2.6.9L19 20l-.9-2.6-2.6-.9 2.6-.9L19 13z"/></svg></div>
      <div>
        <div class="title">ผู้ช่วย AI</div>
        <div class="status"><span class="dot" id="dot"></span><span id="statusText">กำลังเชื่อมต่อ…</span></div>
      </div>
      <div class="sp"></div>
      <button class="icon-btn" id="settingsBtn" title="ตั้งค่า" aria-label="ตั้งค่า">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <button class="icon-btn" id="newBtn" title="แชทใหม่" aria-label="แชทใหม่">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>

    <section class="setup glass" id="setup">
      <span style="font-weight:600; color:var(--text);">ตั้งค่าระบบ & เชื่อมต่อหลายอุปกรณ์</span>
      <span>1. Chat API URL หรือ Webhook ID (Botpress)</span>
      <div class="setup-row">
        <input id="hookInput" placeholder="https://chat.botpress.cloud/xxxxxxxx" autocomplete="off">
      </div>

      <span>2. User Key (คัดลอกรหัสนี้ไปใส่เครื่องอื่น เพื่อให้ประวัติแชทเชื่อมกัน)</span>
      <div class="setup-row">
        <input id="userKeyInput" placeholder="User Key ปัจจุบัน..." autocomplete="off">
        <button id="copyUserKeyBtn" type="button">คัดลอก</button>
      </div>

      <button id="hookSave" type="button" style="padding:10px; margin-top:4px;">บันทึกและซิงค์ข้อมูล</button>
    </section>

    <section class="glass" id="chat" aria-live="polite">
      <div class="empty" id="empty">
        <h2>สวัสดี มีอะไรให้ช่วยไหม</h2>
        <p>พิมพ์ข้อความด้านล่างเพื่อเริ่มคุยกับผู้ช่วย AI ได้เลย</p>
      </div>
    </section>

    <form class="composer glass" id="form">
      <textarea id="input" rows="1" placeholder="พิมพ์ข้อความ…" aria-label="ข้อความ"></textarea>
      <button class="send" id="send" type="submit" aria-label="ส่ง" disabled>
        <svg viewBox="0 0 24 24"><path d="M3.4 20.4l17.5-7.6a.9.9 0 0 0 0-1.6L3.4 3.6a.9.9 0 0 0-1.3.9L3.5 10l9 2-9 2-1.4 5.5a.9.9 0 0 0 1.3.9z"/></svg>
      </button>
    </form>
  </main>
</div>

<script>
const WEBHOOK = "";
const $ = id => document.getElementById(id);

const store = {
  get(k){
    try {
      const v = localStorage.getItem(k);
      if(v === null) return null;
      try { return JSON.parse(v); } catch(e) { return v; }
    } catch(e) { return null; }
  },
  set(k,v){
    try { localStorage.setItem(k, typeof v === 'object' ? JSON.stringify(v) : v); } catch(e){}
  },
  del(k){
    try { localStorage.removeItem(k); } catch(e){}
  }
};

const chat=$('chat'), input=$('input'), sendBtn=$('send');
let base="", userId=null, userKey=null, convId=null, busy=false;
let pollInterval = null;
const seen=new Set();

function resolveBase(){
  let h=(store.get('bp_hook')||WEBHOOK||"").toString().trim().replace(/\/+$/,'');
  if(!h) return "";
  return h.startsWith('http') ? h : 'https://chat.botpress.cloud/'+h;
}

function setStatus(t,s){ $('statusText').textContent=t; $('dot').className='dot '+(s||''); }

async function api(path,{method='GET',body,auth=true}={}){
  const headers={'Content-Type':'application/json'};
  if(auth&&userKey) headers['x-user-key']=userKey;
  const r=await fetch(base+path,{method,headers,body:body?JSON.stringify(body):undefined});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

function getLocalMessages(id){ return store.get('bp_msgs_' + id) || []; }

function saveLocalMessage(id, msgObj){
  let msgs = getLocalMessages(id);
  if(!msgs.some(m => (m.id && m.id === msgObj.id))){
    msgs.push(msgObj);
    store.set('bp_msgs_' + id, msgs);
  }
}

function getSavedHistory(){ return store.get('bp_conversations') || []; }

function saveConversationToHistory(id, title){
  let list = getSavedHistory();
  if(!list.some(item => item.id === id)){
    list.unshift({ id, title: title || 'การสนทนาใหม่', createdAt: new Date().toISOString() });
    store.set('bp_conversations', list);
    renderHistoryList();
  }
}

function renderHistoryList(){
  const list = getSavedHistory();
  const container = $('historyList');
  if(!container) return;
  container.innerHTML = '';
  
  if(list.length === 0){
    container.innerHTML = '<div style="color:var(--muted);font-size:12px;text-align:center;padding:10px;">ไม่มีประวัติการแชท</div>';
    return;
  }

  list.forEach(item => {
    const div = document.createElement('div');
    div.className = 'history-item ' + (item.id === convId ? 'active' : '');
    div.onclick = () => switchChat(item.id);
    div.innerHTML = `
      <span class="title-text">${esc(item.title)}</span>
      <button class="del-btn" title="ลบประวัติ">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    `;
    div.querySelector('.del-btn').onclick = (e) => {
      e.stopPropagation();
      let newArr = getSavedHistory().filter(x => x.id !== item.id);
      store.set('bp_conversations', newArr);
      store.del('bp_msgs_' + item.id);
      if(convId === item.id) startNewChat(); else renderHistoryList();
    };
    container.appendChild(div);
  });
}

function closeMobileSidebar(){
  $('sidebar').classList.remove('open');$('sidebarOverlay').classList.remove('active');
}

function openMobileSidebar(){
  $('sidebar').classList.add('open');$('sidebarOverlay').classList.add('active');
}

async function switchChat(id){
  convId = id;
  store.set('bp_convId', convId);
  seen.clear();
  chat.innerHTML = '';
  renderHistoryList();
  await loadHistory();
  closeMobileSidebar();
}

function bindEvents(){
  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const t = input.value.trim();
    if(!t) return;
    input.value = ''; input.style.height = 'auto';
    send(t);
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    // แก้ไข: ปลดล็อกปุ่มส่งทันทีที่มีข้อความ ไม่ขึ้นกับ convId
    sendBtn.disabled = busy || !input.value.trim();
  });

  input.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){
      e.preventDefault();
      $('form').requestSubmit();
    }
  });

  $('newBtn').onclick = startNewChat;
  $('newChatSidebarBtn').onclick = startNewChat;
  $('toggleSidebar').onclick = openMobileSidebar;
  $('closeSidebarBtn').onclick = closeMobileSidebar;
  $('sidebarOverlay').onclick = closeMobileSidebar;

  $('settingsBtn').onclick = (e) => {
    e.preventDefault();
    $('setup').classList.toggle('show');
  };

  $('copyUserKeyBtn').onclick = () => {
    const k = $('userKeyInput').value.trim();
    if(k){
      navigator.clipboard?.writeText(k);
      $('copyUserKeyBtn').textContent = "คัดลอกแล้ว!";
      setTimeout(() => $('copyUserKeyBtn').textContent = "คัดลอก", 2000);
    }
  };

  $('hookSave').onclick = () => {
    const h = $('hookInput').value.trim();
    const k = $('userKeyInput').value.trim();
    if(h) store.set('bp_hook', h);
    if(k) store.set('bp_userKey', k);
    store.del('bp_convId');
    store.del('bp_conversations');
    location.reload();
  };
}

async function init(){
  closeMobileSidebar();
  base = resolveBase();
  $('hookInput').value = store.get('bp_hook') || '';
  
  if(!base){
    $('setup').classList.add('show');
    setStatus('กรุณากรอก Webhook ID','err');
    return;
  }

  try {
    userKey = store.get('bp_userKey');
    userId = store.get('bp_userId');
    convId = store.get('bp_convId');

    if(!userKey){
      // แก้ไข: ส่ง { auth: false } อยู่ภายใน options object
      const u = await api('/users', { method:'POST', body:{}, auth: false });
      userKey = u.key; userId = u.user.id;
      store.set('bp_userKey', userKey);
      store.set('bp_userId', userId);
    }
    
    $('userKeyInput').value = userKey || '';
    renderHistoryList();

    if(!convId){
      await createNewConversation();
    } else {
      await loadHistory();
    }
    
    setStatus('ออนไลน์ (Realtime)','on');
    sendBtn.disabled = !input.value.trim();
    startRealtimeSync();

  } catch(e) {
    setStatus('เชื่อมต่อไม่ได้ ตรวจสอบ Webhook ID','err');
  }
}

function startRealtimeSync() {
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(async () => {
    if (document.hidden || !convId || !userKey || busy) return;
    try {
      const d = await api('/conversations/' + convId + '/messages');
      const list = (d.messages || []).sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
      list.forEach(m => {
        if (!seen.has(m.id)) {
          seen.add(m.id);
          const who = m.userId === userId ? 'user' : 'bot';
          render(m.payload, who, m.createdAt);
          saveLocalMessage(convId, { id: m.id, payload: m.payload, who, createdAt: m.createdAt });
        }
      });
    } catch(e){}
  }, 2500);
}

async function createNewConversation(){
  try {
    const c = await api('/conversations', { method:'POST', body:{} });
    convId = c.conversation.id; 
    store.set('bp_convId', convId);
    seen.clear();
    chat.innerHTML = '<div class="empty" id="empty"><h2>สวัสดี มีอะไรให้ช่วยไหม</h2><p>พิมพ์ข้อความด้านล่างเพื่อเริ่มคุยกับผู้ช่วย AI ได้เลย</p></div>';
  } catch(e){}
}

async function loadHistory(){
  if(!convId) return;
  const localMsgs = getLocalMessages(convId);
  if(localMsgs.length > 0){
    $('empty')?.remove();
    localMsgs.forEach(m => {
      seen.add(m.id);
      render(m.payload, m.who, m.createdAt);
    });
  }
  try {
    const d = await api('/conversations/' + convId + '/messages');
    const list = (d.messages || []).sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
    list.forEach(m => {
      if(!seen.has(m.id)){
        seen.add(m.id);
        const who = m.userId === userId ? 'user' : 'bot';
        render(m.payload, who, m.createdAt);
        saveLocalMessage(convId, { id: m.id, payload: m.payload, who, createdAt: m.createdAt });
      }
    });
  } catch(e){}
}

function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function md(s){
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
}

function formatTime(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function render(p, who, timeIso){
  $('empty')?.remove();
  const row = document.createElement('div'); row.className = 'msg ' + who;
  const b = document.createElement('div'); b.className = 'bubble';
  
  if(p.type === 'text'){ 
    b.innerHTML = md(p.text || ''); 
  } else {
    b.textContent = p.text || '[ข้อความไม่รองรับ]';
  }

  // เพิ่มปุ่มคัดลอกข้อความย่อยในกล่องแชท
  if (p.text) {
    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.title = 'คัดลอกข้อความ';
    copyBtn.innerHTML = `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
    copyBtn.onclick = (e) => {
      e.stopPropagation();
      navigator.clipboard?.writeText(p.text);
      copyBtn.style.color = '#7dffb0';
      setTimeout(() => copyBtn.style.color = '', 1500);
    };
    b.appendChild(copyBtn);
  }

  row.appendChild(b);
  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.textContent = formatTime(timeIso || new Date());
  row.appendChild(meta);

  chat.appendChild(row); 
  chat.scrollTop = chat.scrollHeight;
}

async function send(text){
  if(busy || !text.trim()) return;

  // หากยังไม่มีห้องแชท ให้พยายามสร้างอัตโนมัติก่อนส่ง
  if(!convId){
    await createNewConversation();
    if(!convId){
      alert('ไม่สามารถเชื่อมต่อได้ กรุณาตรวจสอบ Webhook ID ในหน้าตั้งค่า');
      return;
    }
  }

  saveConversationToHistory(convId, text.slice(0, 30));

  busy = true; sendBtn.disabled = true;
  const userMsgObj = { id: 'usr_' + Date.now(), payload: { type: 'text', text }, who: 'user', createdAt: new Date().toISOString() };
  render(userMsgObj.payload, 'user', userMsgObj.createdAt);
  saveLocalMessage(convId, userMsgObj);

  try {
    const r = await api('/messages', { method:'POST', body:{ conversationId:convId, payload:{ type:'text', text } } });
    seen.add(r.message.id);
    await waitReply();
  } catch(e){
    render({ type:'text', text:'ส่งข้อความไม่สำเร็จ กรุณาลองใหม่' }, 'bot');
  }
  busy = false; sendBtn.disabled = !input.value.trim();
}

async function waitReply(){
  for(let i = 0; i < 30; i++){
    await new Promise(r => setTimeout(r, 1000));
    try {
      const d = await api('/conversations/' + convId + '/messages');
      const fresh = (d.messages || []).filter(m => !seen.has(m.id) && m.userId !== userId);
      if(fresh.length){
        fresh.forEach(m => { 
          seen.add(m.id); 
          render(m.payload, 'bot', m.createdAt); 
          saveLocalMessage(convId, { id: m.id, payload: m.payload, who: 'bot', createdAt: m.createdAt });
        });
        return;
      }
    } catch(e){}
  }
}

async function startNewChat(){
  store.del('bp_convId');
  await createNewConversation();
  renderHistoryList();
  closeMobileSidebar();
}

bindEvents();
init();
</script>
