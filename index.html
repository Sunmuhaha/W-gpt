<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>แชทกับ AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Google+Sans:wght@400;500;600&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&display=swap" rel="stylesheet">
<style>
:root {
  --wine: #120307;
  --crimson: #e11d48;
  --ruby: #9f1239;
  --coral: #ff6b81;
  --rose: #ffd6dc;
  --glass: rgba(255, 255, 255, 0.08);
  --glass-strong: rgba(255, 255, 255, 0.15);
  --glass-hover: rgba(255, 255, 255, 0.22);
  --line: rgba(255, 255, 255, 0.18);
  --text: #fff5f6;
  --muted: rgba(255, 230, 234, 0.65);
  --sidebar-w: 260px;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -ms-overflow-style: none !important;
  scrollbar-width: none !important;
}
*::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  font-family: 'Google Sans', 'Prompt', system-ui, -apple-system, sans-serif;
  color: var(--text);
  background: radial-gradient(120% 90% at 20% 0%, #4a0a18 0%, var(--wine) 60%) fixed;
}

.orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: .65; pointer-events: none; z-index: 0; }
.o1 { width: 450px; height: 450px; background: var(--crimson); top: -120px; left: -100px; }
.o2 { width: 400px; height: 400px; background: var(--ruby); bottom: -110px; right: -80px; }
.o3 { width: 250px; height: 250px; background: var(--coral); top: 45%; left: 50%; opacity: .25; }

.layout {
  position: relative;
  z-index: 1;
  height: 100%;
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  gap: 14px;
  padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
}

.glass {
  background: var(--glass);
  border: 1px solid var(--line);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
}

.sidebar-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  width: 100vw; height: 100vh;
  background: rgba(0, 0, 0, 0.65);
  z-index: 90;
}
.sidebar-overlay.active { display: block; }

.sidebar {
  width: var(--sidebar-w);
  display: flex;
  flex-direction: column;
  gap: 12px;
  border-radius: 24px;
  padding: 16px;
  flex: none;
  transition: transform 0.25s ease;
  z-index: 100;
}

.sidebar-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sidebar-action-group { display: flex; align-items: center; gap: 6px; }
.sidebar-title { font-size: 15px; font-weight: 600; color: var(--text); }
.history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }

.history-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,0.03);
  border: 1px solid transparent; color: var(--muted); cursor: pointer; font-size: 13px;
  transition: all 0.2s;
}
.history-item:hover { background: var(--glass-strong); color: var(--text); }
.history-item.active { background: var(--glass-hover); border-color: var(--line); color: var(--text); font-weight: 500; }
.history-item .title-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.history-item .del-btn {
  border: 0; background: none; color: var(--muted); cursor: pointer; padding: 4px; display: none;
  border-radius: 6px; line-height: 0; flex: none; transition: all 0.2s;
}
.history-item:hover .del-btn { display: block; }
.history-item .del-btn:hover { color: #ff4d4d; background: rgba(255,255,255,0.15); }

#closeSidebarBtn { display: none; }

.app { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; height: 100%; }

header { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-radius: 22px; z-index: 10; }
.avatar {
  width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; flex: none;
  background: linear-gradient(135deg, var(--coral), var(--crimson));
  box-shadow: 0 6px 18px rgba(225,29,72,0.45), inset 0 1px 0 rgba(255,255,255,0.4);
}
.avatar svg { width: 22px; height: 22px; fill: #fff; }
.title { font-weight: 600; font-size: 16px; letter-spacing: -0.2px; }
.status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 1px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #ffb4bf; transition: .3s; }
.dot.on { background: #7dffb0; box-shadow: 0 0 10px #7dffb0; }
.dot.err { background: #ff4d4d; box-shadow: 0 0 10px #ff4d4d; }
.sp { flex: 1; }

.icon-btn {
  width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass);
  color: var(--text); cursor: pointer; display: grid; place-items: center; transition: all .2s;
  user-select: none; z-index: 10;
}
.icon-btn:hover { background: var(--glass-strong); }
.icon-btn:active { transform: scale(.95); }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

#toggleSidebar { display: none; }

#chat {
  flex: 1; min-height: 0; border-radius: 26px;
  padding: 20px 16px;
  overflow-y: auto; overflow-x: hidden;
  display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth;
}

.empty { margin: auto; text-align: center; max-width: 360px; color: var(--muted); line-height: 1.6; }
.empty h2 { color: var(--text); font-weight: 600; font-size: 22px; margin-bottom: 8px; }

.msg { display: flex; flex-direction: column; max-width: 85%; gap: 4px; }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.bot { align-self: flex-start; align-items: flex-start; }

.msg-meta {
  font-size: 11px; color: var(--muted); padding: 2px 4px;
  display: flex; align-items: center; gap: 8px;
}
.msg.bot .msg-meta { justify-content: flex-start; }
.msg.user .msg-meta { justify-content: flex-end; }

.bubble {
  position: relative; padding: 12px 16px; border-radius: 20px; line-height: 1.6;
  font-size: 14.5px; word-break: break-word; white-space: pre-wrap; max-width: 100%;
}
.bot .bubble {
  background: var(--glass-strong); border: 1px solid var(--line); border-bottom-left-radius: 6px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
}
.user .bubble {
  background: linear-gradient(135deg, rgba(255,107,129,0.9), rgba(225,29,72,0.95));
  border: 1px solid rgba(255,255,255,0.3); border-bottom-right-radius: 6px;
  box-shadow: 0 8px 24px rgba(225,29,72,0.35), inset 0 1px 0 rgba(255,255,255,0.35);
}

.bubble.typing { white-space: normal; padding: 10px 16px; line-height: 1; display: inline-flex; align-items: center; }
.bubble.typing .typing-dots { padding: 0; display: flex; }

.copy-btn {
  border: 0; background: transparent; color: var(--muted);
  padding: 2px 6px; border-radius: 6px; cursor: pointer; transition: all .2s;
  display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-family: inherit;
}
.copy-btn:hover { color: var(--text); background: rgba(255,255,255,0.12); }
.copy-btn svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Code Block Responsive & Tight Spacing (ปรับแก้ไขระยะห่างเรียบร้อยแล้ว) */
.code-block-wrapper {
  margin: 6px 0; border-radius: 12px; overflow: hidden;
  background: rgba(12, 3, 6, 0.85); border: 1px solid var(--line);
  font-family: 'Google Sans Code', monospace; white-space: normal;
  width: 100%; max-width: 100%; box-sizing: border-box;
}
.code-block-wrapper:first-child { margin-top: 4px; }
.code-block-wrapper:last-child { margin-bottom: 4px; }

.code-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 12px; background: rgba(255, 255, 255, 0.08);
  border-bottom: 1px solid rgba(255, 255, 255, 0.1); font-size: 12px; color: var(--muted);
}
.code-lang { font-weight: 600; text-transform: lowercase; color: var(--coral); }
.copy-code-btn {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(255, 255, 255, 0.12); border: 1px solid var(--line);
  color: var(--text); padding: 4px 8px; border-radius: 6px; cursor: pointer;
  font-size: 11px; font-family: 'Google Sans', 'Prompt', sans-serif; transition: all 0.2s;
}
.copy-code-btn:hover { background: rgba(255, 255, 255, 0.25); }
.copy-code-btn.copied { background: #10b981; border-color: #10b981; color: #fff; }
.code-block-wrapper pre {
  margin: 0; padding: 12px; overflow-x: auto; font-size: 13px; line-height: 1.5; color: #ffd6dc;
  max-width: 100%; box-sizing: border-box; -webkit-overflow-scrolling: touch;
}
.code-block-wrapper code { font-family: 'Google Sans Code', Google Sans, Monaco, monospace; white-space: pre; display: block; }
.inline-code {
  background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 2px 6px; border-radius: 6px; font-family: 'Google Sans Code', monospace;
  font-size: 0.9em; color: var(--coral);
}

/* Loading Animations */
.typing-dots {
  display: inline-flex; align-items: center; gap: 5px; padding: 4px 2px;
}
.typing-dots span {
  width: 7px; height: 7px; border-radius: 50%; background: var(--coral);
  animation: dotBounce 1.4s infinite ease-in-out both;
}
.typing-dots span:nth-child(1) { animation-delay: -0.32s; }
.typing-dots span:nth-child(2) { animation-delay: -0.16s; }
@keyframes dotBounce {
  0%, 80%, 100% { transform: scale(0.3); opacity: 0.3; }
  40% { transform: scale(1); opacity: 1; }
}

.chat-loading {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  color: var(--muted); font-size: 14px; margin: auto; padding: 20px 0;
}

.composer { display: flex; align-items: flex-end; gap: 10px; padding: 10px 12px; border-radius: 26px; border: 1px solid var(--line); }
.composer:focus-within { background: rgba(255,255,255,0.12); border-color: rgba(255,107,129,0.6); box-shadow: 0 0 0 4px rgba(225,29,72,0.22); }

textarea {
  flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: var(--text);
  font: inherit; font-size: 15px; line-height: 1.5; padding: 8px 10px; max-height: 140px;
}
textarea::placeholder { color: var(--muted); }

.send {
  width: 44px; height: 44px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.3); cursor: pointer; flex: none;
  display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, var(--coral), var(--crimson));
  box-shadow: 0 8px 20px rgba(225,29,72,0.4); transition: opacity 0.2s;
}
.send:disabled { opacity: .35; cursor: default; }
.send svg { width: 20px; height: 20px; fill: #fff; }

.setup {
  padding: 16px; border-radius: 20px; display: none; gap: 12px; flex-direction: column; font-size: 13px; color: var(--muted);
  border: 1px solid var(--coral); box-shadow: 0 8px 30px rgba(225,29,72,0.2);
}
.setup.show { display: flex; }
.setup-row { display: flex; gap: 8px; }
.setup input {
  flex: 1; min-width: 0; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: rgba(0,0,0,0.4); color: var(--text); font: inherit; font-size: 13px; outline: 0;
}
.setup button {
  padding: 0 16px; border-radius: 12px; border: 0; cursor: pointer; font: inherit; color: #fff;
  background: linear-gradient(135deg, var(--coral), var(--crimson)); font-weight: 500; flex: none;
}

@media (max-width: 768px) {
  .msg { max-width: 92%; }
  .code-block-wrapper pre { font-size: 12px; padding: 10px; }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 280px; height: 100%;
    background: rgba(24, 4, 10, 0.85) !important;
    -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
    border-radius: 0; border-right: 1px solid var(--line);
    transform: translateX(-100%); z-index: 100;
  }
  .sidebar.open { transform: translateX(0); }
  .history-item .del-btn { display: block; opacity: 0.7; }
  #toggleSidebar, #closeSidebarBtn { display: grid; }
}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<div class="layout">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar glass" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">ประวัติการสนทนา</span>
      <div class="sidebar-action-group">
        <button class="icon-btn" id="newChatSidebarBtn" title="สร้างแชทใหม่">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="icon-btn" id="closeSidebarBtn" title="ปิดเมนู">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <div class="history-list" id="historyList"></div>
  </aside>

  <main class="app">
    <header class="glass">
      <button class="icon-btn" id="toggleSidebar" aria-label="เมนูประวัติ">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="avatar"><svg viewBox="0 0 24 24"><path d="M12 2l1.8 5.4L19 9l-5.2 1.6L12 16l-1.8-5.4L5 9l5.2-1.6L12 2zm7 11l.9 2.6 2.6.9-2.6.9L19 20l-.9-2.6-2.6-.9 2.6-.9L19 13z"/></svg></div>
      <div>
        <div class="title">ผู้ช่วย AI</div>
        <div class="status"><span class="dot" id="dot"></span><span id="statusText">กำลังเชื่อมต่อ…</span></div>
      </div>
      <div class="sp"></div>
      <button class="icon-btn" id="settingsBtn" title="ตั้งค่า Webhook" aria-label="ตั้งค่า">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <button class="icon-btn" id="newBtn" title="แชทใหม่" aria-label="แชทใหม่">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>

    <section class="setup glass" id="setup">
      <span style="font-weight:600; color:var(--text);">ตั้งค่าการเชื่อมต่อ (Botpress Webhook)</span>
      <span>1. Webhook URL หรือ Webhook ID จาก Botpress</span>
      <div class="setup-row">
        <input id="hookInput" placeholder="https://chat.botpress.cloud/xxxx-xxxx หรือ xxxx-xxxx" autocomplete="off">
      </div>

      <span>2. User Key (สำหรับซิงค์ประวัติข้ามเครื่อง)</span>
      <div class="setup-row">
        <input id="userKeyInput" placeholder="สร้างให้อัตโนมัติเมื่อเชื่อมต่อ..." autocomplete="off">
        <button id="copyUserKeyBtn" type="button">คัดลอก</button>
      </div>

      <button id="hookSave" type="button" style="padding:10px; margin-top:4px;">บันทึกและเชื่อมต่อใหม่</button>
    </section>

    <section class="glass" id="chat" aria-live="polite">
      <div class="empty" id="empty">
        <h2>สวัสดี มีอะไรให้ช่วยไหม</h2>
        <p>พิมพ์ข้อความด้านล่างเพื่อเริ่มคุยกับผู้ช่วย AI ได้เลย</p>
      </div>
    </section>

    <form class="composer glass" id="form">
      <textarea id="input" rows="1" placeholder="พิมพ์ข้อความ…" aria-label="ข้อความ"></textarea>
      <button class="send" id="send" type="submit" aria-label="ส่ง">
        <svg viewBox="0 0 24 24"><path d="M3.4 20.4l17.5-7.6a.9.9 0 0 0 0-1.6L3.4 3.6a.9.9 0 0 0-1.3.9L3.5 10l9 2-9 2-1.4 5.5a.9.9 0 0 0 1.3.9z"/></svg>
      </button>
    </form>
  </main>
</div>

<script>
const WEBHOOK = "";
const $ = id => document.getElementById(id);

const store = {
  get(k){
    try {
      const v = localStorage.getItem(k);
      if(v === null) return null;
      try { return JSON.parse(v); } catch(e) { return v; }
    } catch(e) { return null; }
  },
  set(k,v){
    try { localStorage.setItem(k, typeof v === 'object' ? JSON.stringify(v) : v); } catch(e){}
  },
  del(k){
    try { localStorage.removeItem(k); } catch(e){}
  }
};

const chat=$('chat'), input=$('input'), sendBtn=$('send');
let base="", userId=null, userKey=null, convId=null, busy=false;
let pollInterval = null;
let loadToken = 0, loadingHistory = false;
const seen=new Set();

function resolveBase(){
  let h=(store.get('bp_hook')||WEBHOOK||"").toString().trim().replace(/\/+$/,'');
  if(!h) return "";
  return h.startsWith('http') ? h : 'https://chat.botpress.cloud/'+h;
}

function setStatus(t,s){ 
  $('statusText').textContent=t; 
  $('dot').className='dot '+(s||''); 
}

function isUserMessage(msg) {
  if (!msg) return false;
  if (msg.who === 'user') return true;
  if (msg.userId && userId && String(msg.userId) === String(userId)) return true;
  return false;
}

async function api(path, { method='GET', body, auth=true, timeout=8000 }={}){
  if(!base) throw new Error("No Base URL");
  const headers={'Content-Type':'application/json'};
  if(auth && userKey) headers['x-user-key']=userKey;

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);

  try {
    const r = await fetch(base + path, {
      method,
      headers,
      body: body ? JSON.stringify(body) : undefined,
      signal: controller.signal
    });
    clearTimeout(timer);
    if(!r.ok) {
      const err = new Error('HTTP ' + r.status);
      err.status = r.status;
      throw err;
    }
    return await r.json();
  } catch(e) {
    clearTimeout(timer);
    throw e;
  }
}

function getLocalMessages(id){
  const raw = store.get('bp_msgs_' + id) || [];
  const ids = new Set();
  return raw.filter(m => {
    if(!m || !m.id) return true;
    if(ids.has(m.id)) return false;
    ids.add(m.id);
    return true;
  });
}

// แทนที่ข้อความชั่วคราว (tempId) ด้วย id จริงจากเซิร์ฟเวอร์ ไม่ให้เก็บซ้ำสองชุด
function replaceLocalMessageId(id, oldId, msgObj){
  const msgs = getLocalMessages(id);
  const realIdx = msgs.findIndex(m => m.id === msgObj.id);
  const oldIdx = msgs.findIndex(m => m.id === oldId);
  if(realIdx !== -1){
    if(oldIdx !== -1) msgs.splice(oldIdx, 1);
  } else if(oldIdx !== -1){
    msgs[oldIdx] = msgObj;
  } else {
    msgs.push(msgObj);
  }
  store.set('bp_msgs_' + id, msgs);
}

function saveLocalMessage(id, msgObj){
  let msgs = getLocalMessages(id);
  if(!msgs.some(m => (m.id && m.id === msgObj.id))){
    msgs.push(msgObj);
    store.set('bp_msgs_' + id, msgs);
  }
}

function getSavedHistory(){ 
  const list = store.get('bp_conversations') || [];
  const ids = new Set();
  return list.filter(item => {
    if(!item || !item.id || ids.has(item.id)) return false;
    ids.add(item.id);
    const msgs = store.get('bp_msgs_' + item.id) || [];
    return msgs.length > 0;
  });
}

function saveConversationToHistory(id, title){
  if (!id) return;
  let list = store.get('bp_conversations') || [];
  
  let displayTitle = title;
  if (!displayTitle || displayTitle === 'การสนทนาใหม่') {
    const msgs = getLocalMessages(id);
    const firstUserMsg = msgs.find(m => isUserMessage(m) || m.who === 'user');
    if (firstUserMsg && firstUserMsg.payload && firstUserMsg.payload.text) {
      displayTitle = firstUserMsg.payload.text.slice(0, 30);
    } else if (msgs.length > 0 && msgs[0].payload && msgs[0].payload.text) {
      displayTitle = msgs[0].payload.text.slice(0, 30);
    } else {
      displayTitle = 'การสนทนา';
    }
  }

  let existing = list.find(item => item.id === id);
  if (existing) {
    if ((!existing.title || existing.title === 'การสนทนาใหม่') && displayTitle !== 'การสนทนาใหม่') {
      existing.title = displayTitle;
      store.set('bp_conversations', list);
      renderHistoryList();
    }
  } else {
    list.unshift({ id, title: displayTitle, createdAt: new Date().toISOString() });
    store.set('bp_conversations', list);
    renderHistoryList();
  }
}

async function deleteConversation(id, event) {
  if (event) event.stopPropagation();

  let list = store.get('bp_conversations') || [];
  list = list.filter(x => x.id !== id);
  store.set('bp_conversations', list);
  store.del('bp_msgs_' + id);

  try {
    await api('/conversations/' + id, { method: 'DELETE', timeout: 3000 });
  } catch(e) {}

  if (convId === id) {
    const remaining = getSavedHistory();
    if (remaining.length > 0) {
      await switchChat(remaining[0].id);
    } else {
      await startNewChat();
    }
  } else {
    renderHistoryList();
  }
}

async function syncServerConversations(){
  if(!userKey) return;
  try {
    const res = await api('/conversations', { timeout: 5000 });
    const serverConvs = res.conversations || [];
    const additions = [];
    const titleFixes = {};

    for (const sc of serverConvs.slice(0, 15)) {
      if (sc.id === convId) continue; // แชทปัจจุบันจัดการโดย loadHistory/send อยู่แล้ว
      let localMsgs = getLocalMessages(sc.id);

      if (localMsgs.length === 0) {
        try {
          const msgRes = await api('/conversations/' + sc.id + '/messages', { timeout: 3000 });
          if (msgRes.messages && msgRes.messages.length > 0) {
            const formattedMsgs = msgRes.messages.sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
            formattedMsgs.forEach(m => {
              const who = isUserMessage(m) ? 'user' : 'bot';
              saveLocalMessage(sc.id, { id: m.id, payload: m.payload, who, createdAt: m.createdAt });
            });
            localMsgs = getLocalMessages(sc.id);
          }
        } catch(e){}
      }

      if (localMsgs.length === 0) continue;

      const firstUserMsg = localMsgs.find(m => isUserMessage(m) || m.who === 'user');
      const autoTitle = firstUserMsg?.payload?.text?.slice(0, 30) || localMsgs[0]?.payload?.text?.slice(0, 30) || 'การสนทนา';
      additions.push({ id: sc.id, title: autoTitle, createdAt: sc.createdAt });
      titleFixes[sc.id] = autoTitle;
    }

    // อ่านรายการล่าสุดหลังจบ await ทั้งหมด เพื่อไม่ทับ/ซ้ำกับสิ่งที่เพิ่มระหว่างรอ
    const localList = store.get('bp_conversations') || [];
    let updated = false;
    additions.forEach(a => {
      const existing = localList.find(c => c.id === a.id);
      if (!existing) {
        localList.unshift(a);
        updated = true;
      } else if (!existing.title || existing.title === 'การสนทนาใหม่') {
        existing.title = titleFixes[a.id];
        updated = true;
      }
    });

    if (updated) {
      store.set('bp_conversations', localList);
      renderHistoryList();
    }
  } catch(e) {}
}

function renderHistoryList(){
  const list = getSavedHistory();
  const container = $('historyList');
  if(!container) return;
  container.innerHTML = '';
  
  if(list.length === 0){
    container.innerHTML = '<div style="color:var(--muted);font-size:12px;text-align:center;padding:10px;">ไม่มีประวัติการแชท</div>';
    return;
  }

  list.forEach(item => {
    const div = document.createElement('div');
    div.className = 'history-item ' + (item.id === convId ? 'active' : '');
    div.onclick = () => switchChat(item.id);
    div.innerHTML = `
      <span class="title-text">${esc(item.title)}</span>
      <button class="del-btn" title="ลบประวัติ">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    `;
    div.querySelector('.del-btn').onclick = (e) => deleteConversation(item.id, e);
    container.appendChild(div);
  });
}

function closeMobileSidebar(){
  $('sidebar').classList.remove('open');$('sidebarOverlay').classList.remove('active');
}

function openMobileSidebar(){
  $('sidebar').classList.add('open');$('sidebarOverlay').classList.add('active');
}

function showBotLoading() {
  removeBotLoading();
  const row = document.createElement('div');
  row.className = 'msg bot';
  row.id = 'botLoadingIndicator';
  row.innerHTML = '<div class="bubble typing"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function removeBotLoading() {
  const el = document.getElementById('botLoadingIndicator');
  if (el) el.remove();
}

function showChatHistoryLoading() {
  chat.innerHTML = `
    <div class="chat-loading">
      <div class="typing-dots">
        <span></span><span></span><span></span>
      </div>
      <span>กำลังโหลดประวัติการสนทนา...</span>
    </div>
  `;
}

async function switchChat(id){
  convId = id;
  store.set('bp_convId', convId);
  seen.clear();
  chat.innerHTML = '';
  renderHistoryList();
  await loadHistory();
  closeMobileSidebar();
}

function bindEvents(){
  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const t = input.value.trim();
    if(!t) return;
    input.value = ''; input.style.height = 'auto';
    send(t);
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    sendBtn.disabled = busy || !input.value.trim();
  });

  input.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){
      e.preventDefault();
      $('form').requestSubmit();
    }
  });

  $('newBtn').onclick = startNewChat;
  $('newChatSidebarBtn').onclick = startNewChat;
  $('toggleSidebar').onclick = openMobileSidebar;
  $('closeSidebarBtn').onclick = closeMobileSidebar;
  $('sidebarOverlay').onclick = closeMobileSidebar;

  $('settingsBtn').onclick = (e) => {
    e.preventDefault();
    $('setup').classList.toggle('show');
  };

  $('copyUserKeyBtn').onclick = () => {
    const k = $('userKeyInput').value.trim();
    if(k){
      navigator.clipboard?.writeText(k);
      $('copyUserKeyBtn').textContent = "คัดลอกแล้ว!";
      setTimeout(() => $('copyUserKeyBtn').textContent = "คัดลอก", 2000);
    }
  };

  $('hookSave').onclick = () => {
    const h = $('hookInput').value.trim();
    const k = $('userKeyInput').value.trim();
    if(h) store.set('bp_hook', h);
    if(k) store.set('bp_userKey', k); else store.del('bp_userKey');
    store.del('bp_convId');
    store.del('bp_conversations');
    location.reload();
  };
}

async function init(){
  closeMobileSidebar();
  base = resolveBase();
  $('hookInput').value = store.get('bp_hook') || '';

  if(!base){
    $('setup').classList.add('show');
    setStatus('กรุณากรอก Webhook URL','err');
    return;
  }

  try {
    userKey = store.get('bp_userKey');
    userId = store.get('bp_userId');
    convId = store.get('bp_convId');

    if(!userKey){
      const u = await api('/users', { method:'POST', body:{}, auth: false });
      userKey = u.key; 
      userId = u.user ? u.user.id : u.id;
      store.set('bp_userKey', userKey);
      store.set('bp_userId', userId);
    }
    
    if(userKey && !userId){
      try {
        const me = await api('/users/me', { timeout: 4000 });
        userId = (me.user && me.user.id) || me.id || null;
        if(userId) store.set('bp_userId', userId);
      } catch(e){}
    }

    $('userKeyInput').value = userKey || '';

    if(!convId){
      await createNewConversation();
    } else {
      await loadHistory();
    }
    
    setStatus('ออนไลน์','on');
    sendBtn.disabled = !input.value.trim();
    
    renderHistoryList();
    startRealtimeSync();
    syncServerConversations();

  } catch(e) {
    if(e.status === 401 || e.status === 404){
      store.del('bp_userKey');
      store.del('bp_convId');
    }
    setStatus('เชื่อมต่อไม่ได้ ตรวจสอบ Webhook','err');
    $('setup').classList.add('show');
  }
}

function startRealtimeSync() {
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(async () => {
    if (document.hidden || !convId || !userKey || busy || loadingHistory) return;
    const cid = convId;
    try {
      const d = await api('/conversations/' + cid + '/messages', { timeout: 4000 });
      // ทิ้งผลลัพธ์ถ้าระหว่างรอมีการส่งข้อความ / สลับแชท / โหลดประวัติ (กันเรนเดอร์ซ้ำ)
      if (busy || loadingHistory || cid !== convId) return;
      const list = (d.messages || []).sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
      list.forEach(m => {
        if (!seen.has(m.id)) {
          seen.add(m.id);
          const who = isUserMessage(m) ? 'user' : 'bot';
          render(m.payload, who, m.createdAt, who === 'bot');
          saveLocalMessage(cid, { id: m.id, payload: m.payload, who, createdAt: m.createdAt });
          saveConversationToHistory(cid);
        }
      });
    } catch(e){}
  }, 3000);
}

async function createNewConversation(){
  try {
    const c = await api('/conversations', { method:'POST', body:{} });
    convId = c.conversation.id; 
    store.set('bp_convId', convId);
    seen.clear();
    chat.innerHTML = '<div class="empty" id="empty"><h2>สวัสดี มีอะไรให้ช่วยไหม</h2><p>พิมพ์ข้อความด้านล่างเพื่อเริ่มคุยกับผู้ช่วย AI ได้เลย</p></div>';
  } catch(e){
    throw e;
  }
}

async function loadHistory(){
  if(!convId) return;

  const cid = convId;
  const token = ++loadToken;
  loadingHistory = true;
  showChatHistoryLoading();

  try {
    try {
      const d = await api('/conversations/' + cid + '/messages');
      if(token !== loadToken || cid !== convId) return; // มีการโหลด/สลับแชทใหม่กว่าแล้ว
      const list = (d.messages || []).sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));

      chat.innerHTML = '';
      seen.clear();

      if(list.length > 0) {
        $('empty')?.remove();
        const updatedLocalList = [];
        list.forEach(m => {
          if(seen.has(m.id)) return; // กัน id ซ้ำ
          seen.add(m.id);
          const who = isUserMessage(m) ? 'user' : 'bot';
          render(m.payload, who, m.createdAt, false);
          updatedLocalList.push({ id: m.id, payload: m.payload, who, createdAt: m.createdAt });
        });
        store.set('bp_msgs_' + cid, updatedLocalList);
        saveConversationToHistory(cid);
        return;
      }
    } catch(e){
      if(token !== loadToken || cid !== convId) return;
    }

    const localMsgs = getLocalMessages(cid);
    if(localMsgs.length > 0){
      $('empty')?.remove();
      chat.innerHTML = '';
      seen.clear();
      localMsgs.forEach(m => {
        if(seen.has(m.id)) return;
        seen.add(m.id);
        render(m.payload, m.who, m.createdAt, false);
      });
    } else {
      chat.innerHTML = '<div class="empty" id="empty"><h2>สวัสดี มีอะไรให้ช่วยไหม</h2><p>พิมพ์ข้อความด้านล่างเพื่อเริ่มคุยกับผู้ช่วย AI ได้เลย</p></div>';
    }
  } finally {
    if(token === loadToken) loadingHistory = false;
  }
}

function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function parseMarkdown(text) {
  if (!text) return '';
  const codeBlocks = [];
  let str = text.replace(/```(\w*)\r?\n?([\s\S]*?)```/g, (match, lang, code) => {
    const placeholder = `___CODEBLOCK_${codeBlocks.length}___`;
    codeBlocks.push({ lang: lang.trim() || 'code', code: code.trim() });
    return placeholder;
  });

  str = esc(str);
  str = str.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
  str = str.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  str = str.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');

  // ตัด \n ที่ติดอยู่ก่อนและหลัง placeholder ออก เพื่อป้องกันบรรทัดว่างเกินจำจำเป็นใน white-space: pre-wrap
  str = str.replace(/\s*(___CODEBLOCK_\d+___)\s*/g, '$1');

  codeBlocks.forEach((cb, i) => {
    const placeholder = `___CODEBLOCK_${i}___`;
    const codeEscaped = esc(cb.code);
    const html = '<div class="code-block-wrapper">'
      + '<div class="code-header"><span class="code-lang">' + cb.lang + '</span>'
      + '<button class="copy-code-btn" type="button" onclick="copyCodeBlock(this)">'
      + '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'
      + '<span>คัดลอกโค้ด</span></button></div>'
      + '<pre><code class="code-content">' + codeEscaped + '</code></pre></div>';
    str = str.replace(placeholder, () => html);
  });

  return str;
}

window.copyCodeBlock = function(btn) {
  const wrapper = btn.closest('.code-block-wrapper');
  const codeText = wrapper.querySelector('.code-content')?.textContent || '';
  if (navigator.clipboard) {
    navigator.clipboard.writeText(codeText).then(() => {
      const span = btn.querySelector('span');
      const origText = span.textContent;
      span.textContent = 'คัดลอกแล้ว!';
      btn.classList.add('copied');
      setTimeout(() => {
        span.textContent = origText;
        btn.classList.remove('copied');
      }, 2000);
    });
  }
};

function formatTime(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function appendCopyMsgBtn(container, fullText) {
  if (!fullText) return;
  const copyBtn = document.createElement('button');
  copyBtn.className = 'copy-btn';
  copyBtn.type = 'button';
  copyBtn.title = 'คัดลอกข้อความทั้งหมด';
  copyBtn.innerHTML = `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>คัดลอก</span>`;
  copyBtn.onclick = (e) => {
    e.stopPropagation();
    navigator.clipboard?.writeText(fullText);
    const span = copyBtn.querySelector('span');
    if (span) span.textContent = 'คัดลอกแล้ว!';
    copyBtn.style.color = '#7dffb0';
    setTimeout(() => {
      if (span) span.textContent = 'คัดลอก';
      copyBtn.style.color = '';
    }, 1500);
  };
  container.appendChild(copyBtn);
}

function render(p, who, timeIso, animate = false){
  $('empty')?.remove();
  const row = document.createElement('div'); row.className = 'msg ' + who;
  const b = document.createElement('div'); b.className = 'bubble';
  
  row.appendChild(b);

  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  
  const timeSpan = document.createElement('span');
  timeSpan.textContent = formatTime(timeIso || new Date());
  meta.appendChild(timeSpan);

  row.appendChild(meta);
  chat.appendChild(row);

  if (who === 'bot' && animate && p.type === 'text' && p.text) {
    let fullText = p.text;
    let i = 0;
    let speed = 15;
    let step = Math.max(1, Math.floor(fullText.length / 120));

    let timer = setInterval(() => {
      i += step;
      if (i >= fullText.length) {
        i = fullText.length;
        clearInterval(timer);
        if (p.text) appendCopyMsgBtn(meta, fullText);
      }
      b.innerHTML = parseMarkdown(fullText.slice(0, i));
      chat.scrollTop = chat.scrollHeight;
    }, speed);

  } else {
    if(p.type === 'text'){ 
      b.innerHTML = parseMarkdown(p.text || ''); 
    } else {
      b.textContent = p.text || '[ข้อความไม่รองรับ]';
    }
    if (p.text) appendCopyMsgBtn(meta, p.text);
    chat.scrollTop = chat.scrollHeight;
  }
}

async function send(text){
  if(busy || !text.trim()) return;
  busy = true; sendBtn.disabled = true; // ล็อกก่อน await ใดๆ กันกดส่งซ้ำ

  if(!convId){
    try {
      await createNewConversation();
    } catch(e) {
      busy = false; sendBtn.disabled = !input.value.trim();
      alert('ไม่สามารถเชื่อมต่อได้ กรุณาตรวจสอบ Webhook URL ในตั้งค่า');
      $('setup').classList.add('show');
      return;
    }
  }

  const cid = convId;
  const tempId = 'usr_' + Date.now();
  const userMsgObj = { id: tempId, payload: { type: 'text', text }, who: 'user', createdAt: new Date().toISOString() };
  
  seen.add(tempId);
  render(userMsgObj.payload, 'user', userMsgObj.createdAt, false);
  saveLocalMessage(cid, userMsgObj);
  saveConversationToHistory(cid, text.slice(0, 30));

  showBotLoading();

  try {
    const r = await api('/messages', { method:'POST', body:{ conversationId:cid, payload:{ type:'text', text } } });
    if (r && r.message) {
      if (cid === convId) seen.add(r.message.id);
      replaceLocalMessageId(cid, tempId, { id: r.message.id, payload: { type:'text', text }, who: 'user', createdAt: r.message.createdAt || userMsgObj.createdAt });
    }
    await waitReply(cid);
  } catch(e){
    removeBotLoading();
    render({ type:'text', text:'ส่งข้อความไม่สำเร็จ กรุณาตรวจสอบการเชื่อมต่อ' }, 'bot', new Date(), false);
  }
  busy = false; sendBtn.disabled = !input.value.trim();
}

async function waitReply(cid){
  const known = new Set(getLocalMessages(cid).map(m => m.id));
  for(let i = 0; i < 20; i++){
    await new Promise(r => setTimeout(r, 1000));
    try {
      const d = await api('/conversations/' + cid + '/messages');
      const active = (cid === convId);
      const fresh = (d.messages || []).filter(m => !isUserMessage(m) && !(active ? seen.has(m.id) : known.has(m.id)));
      if(fresh.length){
        removeBotLoading();
        fresh.sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt)).forEach(m => {
          // ถ้าผู้ใช้สลับแชทระหว่างรอ ให้เก็บลงที่เก็บของแชทเดิมเท่านั้น ไม่เรนเดอร์ลงแชทที่เปิดอยู่
          if (cid === convId) {
            seen.add(m.id);
            render(m.payload, 'bot', m.createdAt, true);
          }
          saveLocalMessage(cid, { id: m.id, payload: m.payload, who: 'bot', createdAt: m.createdAt });
        });
        saveConversationToHistory(cid);
        return;
      }
    } catch(e){}
  }
  removeBotLoading();
}

async function startNewChat(){
  store.del('bp_convId');
  try {
    await createNewConversation();
    renderHistoryList();
    closeMobileSidebar();
  } catch(e) {
    alert('ไม่สามารถสร้างแชทใหม่ได้ กรุณาตรวจสอบการตั้งค่า');
  }
}

bindEvents();
init();
